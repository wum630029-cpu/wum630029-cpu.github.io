{{ define "main" }}
<div class="container">
  <nav class="breadcrumb" aria-label="面包屑">
    <a href="{{ "/" | relURL }}">首页</a>
    <span class="sep">/</span>
    <span class="current">{{ .Title }}</span>
  </nav>

  <h1 style="font-size: 1.9rem; font-weight: 900; margin-bottom: 8px;">{{ .Title }}</h1>
  {{ with .Content }}
    <div class="article-content" style="margin-top: 12px;">{{ . }}</div>
  {{ end }}

  {{ if .Pages }}
    {{ partial "search.html" . }}
  {{ end }}

  <div class="article-list" style="margin-top: 32px;">
    {{ range .Pages.ByDate.Reverse }}
      {{ partial "article-card.html" . }}
    {{ end }}
    {{ if not .Pages }}
      <p style="color: var(--muted);">该栏目暂无内容。</p>
    {{ end }}
  </div>
</div>
{{ end }}
