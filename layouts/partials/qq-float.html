<div class="qq-float" id="qqFloat">
  <div class="qq-card" id="qqCard" role="region" aria-label="QQ 咨询">
    <div class="qq-card-title">问买 USDT / 注册 / 提币?</div>
    <p class="qq-card-desc">加 QQ 一对一答疑，比翻文章更快。</p>
    <div class="qq-card-row">
      <span>QQ：</span>
      <button type="button" class="qq-copy-btn" id="qqCopyBtn" data-qq="2205140368" title="点击复制 QQ 号">2205140368</button>
      <span class="qq-copied-tip" id="qqCopiedTip" role="status">已复制 ✓</span>
    </div>
  </div>
  <button type="button" class="qq-btn" id="qqToggleBtn" aria-expanded="false" aria-controls="qqCard">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" role="img">
      <defs>
        <linearGradient id="qqGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#28C3FF"/>
          <stop offset="1" stop-color="#0D9BEA"/>
        </linearGradient>
      </defs>
      <path fill="url(#qqGrad)" d="M21.395 15.035a40 40 0 0 0-.803-2.264l-1.079-2.695c.001-.032.014-.562.014-.836C19.526 4.632 17.351 0 12 0S4.474 4.632 4.474 9.241c0 .274.013.804.014.836l-1.08 2.695a39 39 0 0 0-.802 2.264c-1.021 3.283-.69 4.643-.438 4.673.54.065 2.103-2.472 2.103-2.472 0 1.469.756 3.387 2.394 4.771-.612.188-1.363.479-1.845.835-.434.32-.379.646-.301.778.343.578 5.883.369 7.482.189 1.6.18 7.14.389 7.483-.189.078-.132.132-.458-.301-.778-.483-.356-1.233-.646-1.846-.836 1.637-1.384 2.393-3.302 2.393-4.771 0 0 1.563 2.537 2.103 2.472.251-.03.581-1.39-.438-4.673"/>
    </svg>
    <span>QQ 咨询</span>
  </button>
</div>

<script>
(function() {
  var floatEl = document.getElementById('qqFloat');
  var toggleBtn = document.getElementById('qqToggleBtn');
  var copyBtn = document.getElementById('qqCopyBtn');
  var tip = document.getElementById('qqCopiedTip');
  var hideTimer = null;

  function open() {
    floatEl.classList.add('open');
    toggleBtn.setAttribute('aria-expanded', 'true');
  }

  function close() {
    floatEl.classList.remove('open');
    toggleBtn.setAttribute('aria-expanded', 'false');
  }

  function doCopy(qq) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(qq).then(showTip, function() { fallbackCopy(qq); });
    } else {
      fallbackCopy(qq);
    }
  }

  // 桌面端：卡片常驻展开（点空白处不收起，Esc 可收起、悬停重新展开），点按钮复制 QQ 号；
  // 触屏端：点按展开/收起，点空白处收起
  var hoverCapable = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  if (hoverCapable) {
    open();
    floatEl.addEventListener('mouseenter', open);
    toggleBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      doCopy(copyBtn.getAttribute('data-qq'));
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && floatEl.classList.contains('open')) close();
    });
  } else {
    toggleBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (floatEl.classList.contains('open')) { close(); } else { open(); }
    });
    document.addEventListener('click', function(e) {
      if (floatEl.classList.contains('open') && !floatEl.contains(e.target)) close();
    });
  }

  function showTip() {
    tip.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function() { tip.classList.remove('show'); }, 2000);
  }

  function fallbackCopy(qq) {
    var ta = document.createElement('textarea');
    ta.value = qq;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showTip(); } catch (err) {}
    document.body.removeChild(ta);
  }

  copyBtn.addEventListener('click', function() {
    doCopy(copyBtn.getAttribute('data-qq'));
  });
})();
</script>
