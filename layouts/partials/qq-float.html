<div class="qq-float" id="qqFloat">
  <div class="qq-card" id="qqCard" role="region" aria-label="QQ 咨询 · 币安注册安装">
    <div class="qq-card-title">币安注册 / 安装 / 买 USDT?</div>
    <p class="qq-card-desc">加 QQ 一对一答疑，比翻文章更快。</p>
    <div class="qq-card-row">
      <span>QQ：</span>
      <button type="button" class="qq-copy-btn" id="qqCopyBtn" data-qq="2205140368" title="点击复制 QQ 号">2205140368</button>
      <span class="qq-copied-tip" id="qqCopiedTip" role="status">已复制 ✓</span>
    </div>
  </div>
  <button type="button" class="qq-btn" id="qqToggleBtn" aria-expanded="false" aria-controls="qqCard">
    <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" role="img">
      <ellipse cx="17.5" cy="45" rx="4.3" ry="2.3" fill="#F9AE08"/>
      <ellipse cx="30.5" cy="45" rx="4.3" ry="2.3" fill="#F9AE08"/>
      <path fill="#12B7F5" d="M24 2.5C31 2.5 36.5 8 36.5 15C36.5 23 37.5 30 34 36.5C31.5 41.5 27 44.5 24 44.5C21 44.5 16.5 41.5 14 36.5C10.5 30 11.5 23 11.5 15C11.5 8 17 2.5 24 2.5Z"/>
      <ellipse cx="24" cy="35.5" rx="8.5" ry="7.5" fill="#FFFFFF"/>
      <path fill="#E81C27" d="M13.5 21C13.5 19.5 15 18.5 17 18.5H31C33 18.5 34.5 19.5 34.5 21V25.5C34.5 28 33 29 31 29H17C15 29 13.5 28 13.5 25.5V21Z"/>
      <path fill="#E81C27" d="M27.5 28.5L30.5 38.5L33.4 37.7L29.6 30Z"/>
      <path fill="#F9AE08" d="M24 12L28.5 14.7L24 17.4L19.5 14.7Z"/>
      <circle cx="18.2" cy="10.5" r="1.7" fill="#000000"/>
      <path d="M27.6 9.1C28.9 10.4 30.5 10.4 31 9.1" stroke="#000000" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>
    <span>QQ 咨询 · 币安注册安装</span>
  </button>
</div>

<script>
(function() {
  var floatEl = document.getElementById('qqFloat');
  var toggleBtn = document.getElementById('qqToggleBtn');
  var copyBtn = document.getElementById('qqCopyBtn');
  var tip = document.getElementById('qqCopiedTip');
  var hideTimer = null;

  function open() {
    floatEl.classList.add('open');
    toggleBtn.setAttribute('aria-expanded', 'true');
  }

  function close() {
    floatEl.classList.remove('open');
    toggleBtn.setAttribute('aria-expanded', 'false');
  }

  function doCopy(qq) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(qq).then(showTip, function() { fallbackCopy(qq); });
    } else {
      fallbackCopy(qq);
    }
  }

  // 桌面端：卡片仅在鼠标悬停时显示（移开收起），点按钮复制 QQ 号；
  // 触屏端：点按展开/收起，点空白处收起
  var hoverCapable = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  if (hoverCapable) {
    floatEl.addEventListener('mouseenter', open);
    floatEl.addEventListener('mouseleave', close);
    toggleBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      doCopy(copyBtn.getAttribute('data-qq'));
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && floatEl.classList.contains('open')) close();
    });
  } else {
    toggleBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (floatEl.classList.contains('open')) { close(); } else { open(); }
    });
    document.addEventListener('click', function(e) {
      if (floatEl.classList.contains('open') && !floatEl.contains(e.target)) close();
    });
  }

  function showTip() {
    tip.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function() { tip.classList.remove('show'); }, 2000);
  }

  function fallbackCopy(qq) {
    var ta = document.createElement('textarea');
    ta.value = qq;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showTip(); } catch (err) {}
    document.body.removeChild(ta);
  }

  copyBtn.addEventListener('click', function() {
    doCopy(copyBtn.getAttribute('data-qq'));
  });
})();
</script>
