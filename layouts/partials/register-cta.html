<script>
(function() {
  var btn = document.querySelector('.apk-copy-btn');
  if (!btn) return;
  var tip = document.querySelector('.apk-copied-tip');
  var timer = null;

  function showTip() {
    if (!tip) return;
    tip.style.display = 'inline';
    clearTimeout(timer);
    timer = setTimeout(function() { tip.style.display = 'none'; }, 2000);
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showTip(); } catch (err) {}
    document.body.removeChild(ta);
  }

  function doCopy(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(showTip, function() { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }

  btn.addEventListener('click', function() {
    doCopy(btn.getAttribute('data-apk'));
  });
})();
</script>
