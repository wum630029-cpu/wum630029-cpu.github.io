{{/*
  手机端下载悬浮条：页面向上滑动后从底部滑出。
  由 baseof 传入 dict：brand、line、href、cta、label、aria（币安 / OKX 两套文案）。
  仅在窄屏显示，桌面端不渲染视觉效果；可手动关闭，本次浏览内不再出现。
*/}}
<div id="mobileDownloadBar" class="mobile-download-bar" role="complementary" aria-label="{{ .aria }}" aria-hidden="true">
  <div class="mobile-download-bar-inner">
    <div class="mobile-download-bar-copy">
      <p class="mobile-download-bar-title">{{ .brand }}</p>
      <p class="mobile-download-bar-rebate">{{ .line }}</p>
    </div>
    <a
      class="mobile-download-bar-btn"
      href="{{ .href }}"
      target="_blank"
      rel="sponsored nofollow noopener noreferrer"
      data-cta="{{ .cta }}"
      data-cta-position="mobile-download-bar"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 4v11m0 0l-4-4m4 4l4-4M5 18.5v.5a1.5 1.5 0 001.5 1.5h11A1.5 1.5 0 0019 19v-.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>{{ .label }}</span>
    </a>
    <button type="button" class="mobile-download-bar-close" id="mobileDownloadBarClose" aria-label="关闭下载条">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>

<script>
(function () {
  var bar = document.getElementById('mobileDownloadBar');
  if (!bar) return;

  var closeBtn = document.getElementById('mobileDownloadBarClose');
  var SHOW_AT = 120;
  var HIDE_AT = 60;
  var mobileQuery = window.matchMedia('(max-width: 767px)');

  // 关闭只在当前这次浏览内生效：刷新或进入下一篇页面会重新出现，不做跨页记住
  var dismissed = false;

  function setVisible(visible) {
    bar.classList.toggle('is-visible', visible);
    bar.setAttribute('aria-hidden', visible ? 'false' : 'true');
    document.body.classList.toggle('has-mobile-download-bar', visible);
  }

  function update() {
    if (dismissed || !mobileQuery.matches) {
      setVisible(false);
      return;
    }
    var scrolled = window.scrollY;
    if (scrolled > SHOW_AT) setVisible(true);
    else if (scrolled < HIDE_AT) setVisible(false);
  }

  if (closeBtn) {
    closeBtn.addEventListener('click', function () {
      dismissed = true;
      setVisible(false);
    });
  }

  window.addEventListener('scroll', update, { passive: true });
  if (mobileQuery.addEventListener) mobileQuery.addEventListener('change', update);
  update();
})();
</script>
