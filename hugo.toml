baseURL = 'https://coinvado.net/'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
title = '链上指南'
theme = 'PaperMod'

[params]
  env = 'production'
  author = '链上指南'
  description = '链上指南是专注加密货币与Web3入门的中文教程站点，提供交易所注册、KYC认证、安全设置、入金出金及避坑指南，帮助新手安全进入区块链世界。'
  keywords = ['加密货币', '币圈', 'OKX', '币安', '注册教程', '比特币', '以太坊']
  avatar = '/logo.png'
  label.icon = '/logo.png'
  label.iconHeight = 30

[menu]
  [[menu.main]]
    name = '首页'
    url = '/'
    weight = 10
  [[menu.main]]
    name = '文章'
    url = '/posts/'
    weight = 20
  [[menu.main]]
    name = '标签'
    url = '/tags/'
    weight = 30
  [[menu.main]]
    name = '资源'
    url = '/resources/'
    weight = 35
  [[menu.main]]
    name = '关于'
    url = '/about/'
    weight = 40

[taxonomies]
  tag = 'tags'
  category = 'categories'

[params.assets]
  favicon = '/logo.png'
  favicon16x16 = '/logo.png'
  favicon32x32 = '/logo.png'
  apple_touch_icon = '/logo.png'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      table = true
      strikethrough = true
      linkify = true
      typographer = true
  [markup.highlight]
    style = 'github'
    lineNos = true
    codeFences = true
    guessSyntax = true
    tabSize = 2

[permalinks]
  posts = '/:slug/'

[outputs]
  home = ['HTML', 'RSS', 'SITEMAP']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML']
  term = ['HTML']

[sitemap]
  changefreq = 'daily'
  priority = 0.5
  filename = 'sitemap.xml'

[minify]
  disableXML = true
